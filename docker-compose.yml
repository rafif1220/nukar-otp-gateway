services:
  backend-api:
    build: 
      context: ./otp-backend
    container_name: nukar_otp_backend
    ports:
      - "4000:4000"
    restart: unless-stopped
    env_file:
      - ./otp-backend/.env
    
  frontend-dashboard:
    build: 
      context: ./otp-frontend
    container_name: nukar_otp_frontend
    ports:
      - "3000:3000"
    restart: unless-stopped
    depends_on:
      - backend-api
